<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif: Keliling Bangun Datar (40 Soal)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Fredoka & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
        }
        .font-heading {
            font-family: 'Fredoka', cursive, sans-serif;
        }
        .q-badge {
            transition: all 0.2s ease-in-out;
        }
        .q-badge.answered {
            background-color: #4F46E5;
            color: white;
        }
        .q-badge.current {
            ring: 3px solid #F59E0B;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-amber-400 text-indigo-950 p-2 rounded-2xl font-black text-xl">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <div>
                    <h1 class="font-heading text-xl md:text-2xl font-bold tracking-wide">Kuis Keliling Bangun Datar</h1>
                    <p class="text-xs text-indigo-100">40 Soal Interaktif Matematika Kelas 5 SD</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="resetQuizProgress()" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="hidden sm:inline">Reset Kuis</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Sidebar / Navigation Grid -->
        <aside class="lg:col-span-1 order-2 lg:order-1">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 sticky top-20">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                    <h2 class="font-heading font-bold text-slate-700">Daftar Soal</h2>
                    <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full" id="progress-count">0 / 40 Terjawab</span>
                </div>

                <!-- Grid Buttons -->
                <div class="grid grid-cols-5 gap-2 max-h-80 lg:max-h-none overflow-y-auto p-1" id="questions-grid">
                    <!-- Dynamic Generated Badges -->
                </div>

                <!-- Score Board -->
                <div class="mt-6 pt-4 border-t border-slate-100 bg-slate-50 p-3 rounded-2xl border">
                    <p class="text-xs text-slate-500 font-semibold mb-1">Skor Sementara:</p>
                    <div class="flex justify-between items-end">
                        <span class="text-2xl font-black text-indigo-600" id="current-score">0 / 40</span>
                        <span class="text-xs text-emerald-600 font-bold" id="accuracy-percentage">0% Akurasi</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Question Area -->
        <section class="lg:col-span-3 order-1 lg:order-2">
            <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 min-h-[500px] flex flex-col justify-between">
                
                <div id="question-wrapper">
                    <!-- Dynamic Question Header -->
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                        <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full uppercase" id="q-category">Bangun Datar</span>
                        <span class="text-slate-400 font-extrabold text-sm" id="q-number-title">Soal 1 dari 40</span>
                    </div>

                    <!-- Question Content -->
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                        <!-- SVG Illustration -->
                        <div class="md:col-span-5 bg-slate-50 border border-slate-200 rounded-2xl p-4 flex flex-col items-center justify-center min-h-[220px]" id="q-svg-container">
                            <!-- Dynamic SVG injected here -->
                        </div>

                        <!-- Question Text -->
                        <div class="md:col-span-7">
                            <p class="text-slate-800 font-semibold text-base md:text-lg leading-relaxed" id="q-text">
                                Loading...
                            </p>
                        </div>
                    </div>

                    <!-- Options Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-6 text-sm font-medium" id="options-container">
                        <!-- Dynamic Buttons -->
                    </div>

                    <!-- Instant Feedback Box -->
                    <div id="feedback-box" class="hidden mt-6 p-4 rounded-2xl text-sm font-semibold border">
                        <!-- Dynamic Feedback Content -->
                    </div>
                </div>

                <!-- Footer Navigation -->
                <div class="flex justify-between items-center mt-8 pt-4 border-t border-slate-100">
                    <button id="btn-prev" onclick="navigateQuestion(-1)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-2.5 rounded-xl text-sm transition flex items-center gap-2 disabled:opacity-40">
                        <i class="fa-solid fa-arrow-left"></i> Sebelumnya
                    </button>
                    <button id="btn-next" onclick="navigateQuestion(1)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition flex items-center gap-2 shadow">
                        Selanjutnya <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

            </div>
        </section>

    </main>

        // State Management
        let currentIndex = 0;
        let userAnswers = {}; // { questionId: chosenIndex }

        // Load & Save State (Local Storage)
        function loadSavedState() {
            const saved = localStorage.getItem('quiz_keliling_answers');
            if (saved) {
                try {
                    userAnswers = JSON.parse(saved);
                } catch (e) {
                    userAnswers = {};
                }
            }
            const savedIndex = localStorage.getItem('quiz_keliling_index');
            if (savedIndex !== null) {
                currentIndex = parseInt(savedIndex) || 0;
            }
        }

        function saveState() {
            localStorage.setItem('quiz_keliling_answers', JSON.stringify(userAnswers));
            localStorage.setItem('quiz_keliling_index', currentIndex.toString());
        }

        function resetQuizProgress() {
            if (confirm("Apakah Anda yakin ingin mengulang seluruh kuis dari awal? Jawaban Anda akan dihapus.")) {
                localStorage.removeItem('quiz_keliling_answers');
                localStorage.removeItem('quiz_keliling_index');
                userAnswers = {};
                currentIndex = 0;
                initQuiz();
            }
        }

        // Render Sidebar Navigation Grid
        function renderGrid() {
            const gridContainer = document.getElementById('questions-grid');
            gridContainer.innerHTML = '';

            questionsData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.innerText = idx + 1;
                
                let classes = "w-9 h-9 rounded-xl font-bold text-xs flex items-center justify-center border transition-all ";
                
                if (idx === currentIndex) {
                    classes += "ring-2 ring-amber-400 border-indigo-600 ";
                }

                if (userAnswers.hasOwnProperty(q.id)) {
                    const isCorrect = userAnswers[q.id] === q.answerIndex;
                    if (isCorrect) {
                        classes += "bg-emerald-500 text-white border-emerald-600";
                    } else {
                        classes += "bg-rose-500 text-white border-rose-600";
                    }
                } else {
                    classes += "bg-slate-100 text-slate-600 hover:bg-slate-200 border-slate-200";
                }

                btn.className = classes;
                btn.onclick = () => {
                    currentIndex = idx;
                    saveState();
                    renderQuestion();
                    renderGrid();
                };
                gridContainer.appendChild(btn);
            });

            // Update Progress Counts
            const answeredCount = Object.keys(userAnswers).length;
            document.getElementById('progress-count').innerText = `${answeredCount} / 40 Terjawab`;

            // Calculate Score
            let correctCount = 0;
            questionsData.forEach(q => {
                if (userAnswers[q.id] === q.answerIndex) {
                    correctCount++;
                }
            });

            document.getElementById('current-score').innerText = `${correctCount} / 40`;
            const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
            document.getElementById('accuracy-percentage').innerText = `${accuracy}% Akurasi`;
        }

        // Render Current Question
        function renderQuestion() {
            const q = questionsData[currentIndex];

            // Category & Header Title
            document.getElementById('q-category').innerText = q.category;
            document.getElementById('q-number-title').innerText = `Soal ${currentIndex + 1} dari 40`;

            // SVG & Question Text
            document.getElementById('q-svg-container').innerHTML = q.svg;
            document.getElementById('q-text').innerText = q.text;

            // Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const isAnswered = userAnswers.hasOwnProperty(q.id);
            const chosenIndex = userAnswers[q.id];

            const optionLabels = ["A", "B", "C", "D"];

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                let btnClasses = "p-4 rounded-2xl text-left border flex items-center justify-between transition-all ";

                if (!isAnswered) {
                    btnClasses += "bg-white hover:bg-indigo-50 border-slate-200 text-slate-700 hover:border-indigo-300";
                    btn.onclick = () => selectOption(optIdx);
                } else {
                    btn.disabled = true;
                    if (optIdx === q.answerIndex) {
                        btnClasses += "bg-emerald-100 border-emerald-400 text-emerald-900 font-bold";
                    } else if (optIdx === chosenIndex) {
                        btnClasses += "bg-rose-100 border-rose-400 text-rose-900 font-bold";
                    } else {
                        btnClasses += "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                    }
                }

                btn.className = btnClasses;
                
                let iconHTML = '';
                if (isAnswered) {
                    if (optIdx === q.answerIndex) {
                        iconHTML = `<i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>`;
                    } else if (optIdx === chosenIndex) {
                        iconHTML = `<i class="fa-solid fa-circle-xmark text-rose-600 text-lg"></i>`;
                    }
                }

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-200 text-slate-700 font-bold flex items-center justify-center text-xs shrink-0">${optionLabels[optIdx]}</span>
                        <span>${optText}</span>
                    </div>
                    ${iconHTML}
                `;

                optionsContainer.appendChild(btn);
            });

            // Feedback Box
            const feedbackBox = document.getElementById('feedback-box');
            if (isAnswered) {
                feedbackBox.classList.remove('hidden');
                const isCorrect = chosenIndex === q.answerIndex;
                if (isCorrect) {
                    feedbackBox.className = "mt-6 p-4 rounded-2xl text-sm font-semibold border bg-emerald-50 border-emerald-200 text-emerald-800";
                    feedbackBox.innerHTML = `
                        <div class="flex items-start gap-2">
                            <i class="fa-solid fa-circle-check text-emerald-600 text-lg mt-0.5"></i>
                            <div>
                                <strong class="text-emerald-900">Jawabanmu Benar!</strong>
                                <p class="text-xs font-normal mt-1 text-emerald-700">${q.explanation}</p>
                            </div>
                        </div>
                    `;
                } else {
                    feedbackBox.className = "mt-6 p-4 rounded-2xl text-sm font-semibold border bg-rose-50 border-rose-200 text-rose-800";
                    feedbackBox.innerHTML = `
                        <div class="flex items-start gap-2">
                            <i class="fa-solid fa-circle-xmark text-rose-600 text-lg mt-0.5"></i>
                            <div>
                                <strong class="text-rose-900">Jawaban Kurang Tepat.</strong>
                                <p class="text-xs font-normal mt-1 text-rose-700">${q.explanation}</p>
                            </div>
                        </div>
                    `;
                }
            } else {
                feedbackBox.classList.add('hidden');
            }

            // Prev / Next Buttons State
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-next').disabled = currentIndex === questionsData.length - 1;
        }

        // Handle Option Click
        function selectOption(optIndex) {
            const q = questionsData[currentIndex];
            userAnswers[q.id] = optIndex;
            saveState();
            renderQuestion();
            renderGrid();
        }

        // Navigation
        function navigateQuestion(dir) {
            currentIndex += dir;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= questionsData.length) currentIndex = questionsData.length - 1;
            saveState();
            renderQuestion();
            renderGrid();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initial Load
        function initQuiz() {
            loadSavedState();
            renderQuestion();
            renderGrid();
        }

        window.onload = initQuiz;
    </script>
